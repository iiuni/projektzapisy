name: basic

on: 
  - push
  - pull_request

jobs:
  basic:
    runs-on: ubuntu-22.04
    env: 
      PYTHON_VERSION: 3.10
      NODE_VERSION: 18
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - uses: actions/cache@v3
        with:
          path: zapisy/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('zapisy/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r zapisy/requirements.test.txt
      - name: Install Node Dependencies
        run: |
          cd zapisy
          yarnpkg install --immutable

      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install ansible acl -qq > /dev/null

      - name: Run Ansible
        run: |
          ansible-playbook -D infra/playbooks/dev/playbook.yml
