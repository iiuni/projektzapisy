<div class="dropdown semester-dependent" id="semester-dropdown-container">
    <div class="btn-group btn-block mb-3 w-100">
        <button class="btn btn-light" disabled>
            <strong>Semestr {{ semester }}</strong>
        </button>
        <button class="btn btn-light dropdown-toggle dropdown-toggle-split"
                href="#" role="button" id="semester-dropdown" 
                data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            <span class="sr-only"></span>
        </button>
        <div class="dropdown-menu" aria-labelledby="semester-dropdown">
            {% for semester in all_semesters %}
                <a class="dropdown-item semester-link"
                    href="{% if user_id %}
                            {% url url_pattern_name user_id semester.pk %}
                        {% else %}
                            {% url url_pattern_name semester.pk %}
                        {% endif %}">
                    {{ semester }}
                </a>
            {% endfor %}
        </div>
    </div>
</div>
<script>
    // event used to communicate with Vue component(/s)
    const timetableChangeEvent = new CustomEvent("timetable-change");
    async function fetch_new_semester(url) {
        const response = await fetch(url);
        if (!response.ok){
            return;
        }
        const html = await response.text();
        const parser = new DOMParser();
        const DOMData = parser.parseFromString(html, "text/html");
        let semesterDependentElements = document.querySelectorAll(".semester-dependent");
        for (let elem of semesterDependentElements){
            if (!elem.id){
                continue;
            }
            let elemData = DOMData.getElementById(elem.id);
            let elemContainer = document.getElementById(elem.id);
            if (elemData && elemContainer){
                elemContainer.innerHTML = elemData.innerHTML;
            }
        }
    }
    let semesterDropdown = document.getElementById("semester-dropdown-container");
    if (semesterDropdown !== null) {
        semesterDropdown.addEventListener("click", async (event) => {
            if (event.target.closest(".semester-link")) {
                event.preventDefault();
                const targetUrl = event.target.getAttribute("href");
                await fetch_new_semester(targetUrl);
                window.dispatchEvent(timetableChangeEvent);
                history.pushState({}, "", targetUrl);
            }
        }, true);
        window.addEventListener("popstate", async (event) => {
            let destUrl = window.location.pathname;
            await fetch_new_semester(destUrl);
            window.dispatchEvent(timetableChangeEvent);
        })
    }
</script>
